<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交付文件 · U3 合成原型</title><link rel="stylesheet" href="style.css"></head><body><main class="file-page" id="file"></main><script type="module">
import {TASKS,PROJECTS,FILES} from './data.js';import{escape as e,markdown,content}from'./viewer.js';
const q=new URLSearchParams(location.search),p=q.get('project'),tid=q.get('task'),rid=q.get('result'),fid=q.get('file'),t=TASKS.find(t=>t.project===p&&t.id===tid),r=t?.results.find(r=>r.id===rid),f=FILES[fid],root=document.getElementById('file');
try{document.body.dataset.theme=JSON.parse(sessionStorage.getItem('yuanlei-u3-demo-v1'))?.theme||'light'}catch{}
if(!t||!r||!f||!r.files.includes(fid)){root.innerHTML='<section class="panel empty"><h2>文件不属于此结果或对象已失效</h2><a href="index.html">返回原型入口</a></section>'}else{root.innerHTML=`<div class="page-heading"><div><div class="eyebrow">合成独立文件页 · ${e(PROJECTS[p].name)} / ${e(t.code)} / ${e(rid.toUpperCase())}</div><h1>${e(f.name)}</h1></div><a class="btn" href="index.html#a/${p}/detail/${tid}/${rid}">返回准确结果 ${e(rid.toUpperCase())}</a></div><div class="notice">原办理标签与意见草稿保留。此页是合成文件参考，未证明真实路径的历史不可变性。</div><section class="panel panel-pad">${q.get('missing')==='1'?'<div class="notice error">此文件已失效（模拟），回原结果核对新的证据。</div>':f.type==='image'?`<img style="max-width:100%" src="${f.url}" alt="合成报价对照">`:f.type==='pdf'?`<div class="notice warn">下方由浏览器打开合成 PDF；本轮未验证元垒 PDF/Office 服务。</div><a class="btn" href="${f.url}" target="_blank" rel="noopener">打开 12 页合成 PDF</a>`:markdown(content(fid,r))}</section>`}
</script></body></html>
