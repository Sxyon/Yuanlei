<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="yuanlei-og-title yuanlei-og-desc">
  <title id="yuanlei-og-title">元垒 Open Graph 分享图</title>
  <desc id="yuanlei-og-desc">深海靛背景上的元垒品牌标识与个人、企业 AI 中枢定位。</desc>
  <defs>
