      <stop offset="1" stop-color="#121F45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#28D7E5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#28D7E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#6A87D9" stroke-opacity=".1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="930" cy="315" r="290" fill="url(#glow)"/>
  <circle cx="930" cy="315" r="226" fill="none" stroke="#4C7DFF" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="930" cy="315" r="174" fill="none" stroke="#28D7E5" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 14"/>
  <path d="M704 315h452M930 89v452" stroke="#4C7DFF" stroke-opacity=".22" stroke-width="2"/>
  <g transform="translate(770 155) scale(5)">
