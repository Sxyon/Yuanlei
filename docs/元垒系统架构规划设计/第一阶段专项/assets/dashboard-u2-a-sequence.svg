<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img"><title>A：一次办理时序（候选，当前要求v2 / R3）</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526477"/></marker></defs>
<rect width="960" height="640" fill="#f8fafc"/>
<style>text{font-family:system-ui, -apple-system, sans-serif;fill:#182c40} .node{fill:#fff;stroke:#607e99;stroke-width:1.4} .edge{fill:none;stroke:#526477;stroke-width:1.3;marker-end:url(#arrow)} .label{font-size:14px} .small{font-size:12px}</style>
<text x="25" y="28" text-anchor="start" font-size="18">A：一次办理时序（候选，当前要求v2 / R3）</text>
<rect class="node" x="25" y="48" width="140" height="42" rx="7"/>
<text x="95.0" y="70" text-anchor="middle" font-size="14">用户</text>
<path d="M95,90 L95,590" stroke="#8ca0b4" stroke-dasharray="4 5"/>
<rect class="node" x="210" y="48" width="140" height="42" rx="7"/>
<text x="280.0" y="70" text-anchor="middle" font-size="14">管理概览</text>
<path d="M280,90 L280,590" stroke="#8ca0b4" stroke-dasharray="4 5"/>
<rect class="node" x="395" y="48" width="140" height="42" rx="7"/>
<text x="465.0" y="70" text-anchor="middle" font-size="14">工作详情</text>
<path d="M465,90 L465,590" stroke="#8ca0b4" stroke-dasharray="4 5"/>
<rect class="node" x="580" y="48" width="140" height="42" rx="7"/>
<text x="650.0" y="70" text-anchor="middle" font-size="14">文件查看</text>
<path d="M650,90 L650,590" stroke="#8ca0b4" stroke-dasharray="4 5"/>
<rect class="node" x="785" y="48" width="140" height="42" rx="7"/>
<text x="855.0" y="70" text-anchor="middle" font-size="14">业务服务</text>
<path d="M855,90 L855,590" stroke="#8ca0b4" stroke-dasharray="4 5"/>
<path class="edge" d="M95,125 L280,125"/>
<text x="187.5" y="116" text-anchor="middle" font-size="13">1. 选择工作12 · 当前要求v2的R3</text>
<path class="edge" d="M280,169 L465,169"/>
<text x="372.5" y="160" text-anchor="middle" font-size="13">2. 携带准确结果与返回视图</text>
<path class="edge" d="M465,213 L855,213"/>
<text x="660.0" y="204" text-anchor="middle" font-size="13">3. 读取R3、要求快照及版本</text>
<path class="edge" d="M855,257 L465,257"/>
<text x="660.0" y="248" text-anchor="middle" font-size="13">4. 返回身份 / 依据 / 状态</text>
<path class="edge" d="M95,301 L650,301"/>
<text x="372.5" y="292" text-anchor="middle" font-size="13">5. 核对文件；必要时独立打开</text>
<path class="edge" d="M650,345 L465,345"/>
<text x="557.5" y="336" text-anchor="middle" font-size="13">6. 回R3；保留意见草稿</text>
<path class="edge" d="M95,389 L465,389"/>
<text x="280.0" y="380" text-anchor="middle" font-size="13">7. 接受并完成R3</text>
<path class="edge" d="M465,433 L855,433"/>
<text x="660.0" y="424" text-anchor="middle" font-size="13">8. 按准确对象与版本办理</text>
<path class="edge" d="M855,477 L465,477"/>
<text x="660.0" y="468" text-anchor="middle" font-size="13">9. 回读终态 / 冲突</text>
<path class="edge" d="M465,521 L280,521"/>
<text x="372.5" y="512" text-anchor="middle" font-size="13">10. 用户返回；刷新且保留视图</text>
<text x="25" y="620" text-anchor="start" font-size="13">旧条件 R2 仅对照；接受被当前服务拒绝，补交当前要求结果后再办理。</text>
