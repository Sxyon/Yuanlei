<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DB-S04 R1｜主题维护与项目选择审阅稿</title>
<style>
:root{--bg:#fff;--sub:#f7f8fa;--ink:#252b35;--muted:#647084;--border:#e2e5eb;--primary:#2f65dc;--soft:#edf3ff;--warning:#875714;--warnbg:#fff7e8;--error:#b12e35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,sans-serif}body.dark{--bg:#191d24;--sub:#222832;--ink:#e2e7ef;--muted:#a4adbc;--border:#38404b;--primary:#8aafff;--soft:#28354e;--warning:#f2c783;--warnbg:#362d20;--error:#ff9ca0}button,input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--primary)}button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button.primary{background:var(--primary);color:var(--bg);border-color:var(--primary)}button:disabled{opacity:.5;cursor:default}a{color:var(--primary)}small,.muted{color:var(--muted);font-size:12px}.review{background:var(--warnbg);color:var(--warning);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review select{max-width:100%}.shell{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column;gap:24px;color:var(--muted);text-align:center}aside strong{color:var(--ink)}aside .selected{color:var(--primary)}main{min-width:0}header{padding:20px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:24px;line-height:1.4;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0 16px}nav{padding:12px 32px;border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}nav button[aria-current]{color:var(--primary);background:var(--soft)}.content{max-width:1384px;margin:auto;padding:28px 32px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.panel{border:1px solid var(--border);border-radius:8px;padding:24px;min-width:0}.source{display:block;width:100%;text-align:left;margin:8px 0;padding:14px}.source.active{border-color:var(--primary);background:var(--soft)}.source small{display:block}dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;margin:0 0 20px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.tag{display:inline-block;background:var(--sub);border-radius:20px;padding:2px 9px;font-size:12px}.note{padding:14px 16px;background:var(--sub);border-left:3px solid var(--primary);margin:16px 0}.warning{background:var(--warnbg);border-color:var(--warning);color:var(--warning)}.error{border-color:var(--error);color:var(--error)}.row{padding:18px 0;border-bottom:1px solid var(--border);display:flex;gap:16px;justify-content:space-between;align-items:center}.row:last-child{border:0}.label{font-size:12px;color:var(--primary);margin-right:8px}label{display:block;margin:16px 0 6px}input,select{max-width:100%}textarea{width:100%;min-height:230px;resize:vertical;font:13px/1.7 monospace}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.footer{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{margin:16px 0;padding:14px 16px;border:1px solid var(--border);border-radius:6px}.empty{padding:40px 16px;text-align:center}.previewbox{border:1px dashed var(--border);padding:24px}.previewbox h2{margin-top:0}.pages{display:flex;gap:8px;flex-wrap:wrap}.area{margin-top:24px;background:var(--sub);padding:20px;border-radius:6px}.wide{width:100%}details{margin:12px 0}summary{cursor:pointer}.hidden{display:none}@media(max-width:1024px){.grid{grid-template-columns:220px minmax(0,1fr)}.pair{grid-template-columns:1fr}}@media(max-width:768px){.grid{grid-template-columns:1fr}header,.content{padding:20px}nav{padding:12px 20px}.panel{padding:20px}.row{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.shell{grid-template-columns:52px minmax(0,1fr)}aside{padding:20px 4px;font-size:11px}header{flex-wrap:wrap}h1{font-size:21px}.content{padding:16px 12px}.panel{padding:16px}dl{grid-template-columns:72px minmax(0,1fr)}button{min-height:40px}.review{padding:10px 12px}.review strong{flex-basis:100%}}
</style>
<div class="review"><strong>DB-S04 · R1 待确认设计稿</strong><span>全部身份与状态为合成演示；不访问平台、不保存真实主题或项目</span><select id="view" aria-label="审阅页面"><option value="catalog">P1 主题管理</option><option value="editor">P2 候选与发布</option><option value="selection">P3 项目选择</option><option value="project">P4 项目主题加载</option><option value="maintenance">P5 对账与恢复</option></select><button id="dark">切换明暗</button></div>
<div class="shell"><aside><strong>元垒</strong><span>对话</span><span class="selected">项目</span><span>智能体</span><span>扩展</span></aside><main><header><div><small id="crumb">项目 / 主题管理</small><h1 id="title">主题管理</h1></div><button id="back">返回项目列表</button></header><nav id="nav"></nav><div class="content" id="content"></div></main></div>
<script>
const $=s=>document.querySelector(s);let mode='catalog',scope='personal',tab='candidate',state='normal',rev=3,dirty=false,project='访谈研究',bound='默认管理 1.0.0',generation=2,pick='builtin-research-v1',filePaths={},operation='';
const choices={'builtin-default-v1':{label:'默认管理 1.0.0 · 内置',files:{}},'builtin-research-v1':{label:'调研阅读 1.0.0 · 内置',files:{survey:'JSON'}},'personal-reading-v1':{label:'我的阅读主题 1.0.0 · 个人公共',files:{survey:'JSON'}},'project-reading-v1':{label:'访谈研究专属 1.0.0 · 本项目',files:{survey:'JSON'}}};
const sourceStates={builtin:'active',personal:'active',project:'active'};
const escapeHtml=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const sources={builtin:['默认管理','平台内置 · 只读'],personal:['我的阅读主题','个人公共 · 仅当前用户项目可选'],project:['访谈研究专属','项目专属 · 仅访谈研究可选']};
const button=(label,action,primary=false)=>`<button ${primary?'class="primary"':''} data-action="${action}">${label}</button>`;
function notice(){const messages={loading:'正在读取有权来源与版本…',empty:'暂无来源。可从内置主题建立自己的来源，再维护候选。',denied:'当前项目或来源已无权访问。旧内容已清空，请返回项目列表。',invalid:'候选校验失败：theme.pages[0].blocks[0] 引用了未声明 alias。未登记发布版本，原选择保留。',conflict:'选择已被另一窗口更新。当前为「调研阅读 1.0.0」。请重新核对后提交，旧选择未覆盖新选择。',missing:'已选版本的主题包缺失。保留原选择，可重试或显式选择其他版本。',tampered:'已选版本的 ZIP 摘要不匹配，加载已拒绝。请检查备份或联系维护者。',withdrawn:'来源已安全撤回：资源内容需要复核。原绑定保留，加载已拒绝。',unbound:'目标版本需要的项目文件尚未绑定。请完成映射后再确认；原选择保留。',dbfail:'版本登记失败。未修改项目选择；完整未引用文件已列入维护对账。'};return state==='normal'?'':`<div class="status ${['loading','empty'].includes(state)?'':'error'}" role="alert">${messages[state]} ${button('恢复正常稿','normal')}</div>`;}
function controls(){return `<details><summary>审阅异常状态（合成演示）</summary><div class="actions">${['loading','empty','denied','invalid','conflict','missing','tampered','withdrawn','dbfail'].map(s=>button({loading:'加载',empty:'空目录',denied:'无权',invalid:'非法候选',conflict:'并发选择',missing:'缺包',tampered:'篡改',withdrawn:'撤回',dbfail:'数据库失败'}[s],s)).join('')}</div></details>`;}
function render(){ $('#view').value=mode;$('#crumb').textContent=['selection','project'].includes(mode)?`项目 / ${project} / 主题`:'项目 / 主题管理';$('#title').textContent={catalog:'主题管理',editor:sources[scope][0],selection:`${project} · 选择主题`,project:`${project} · 项目主题`,maintenance:'主题对账与恢复'}[mode];$('#back').textContent=['selection','project'].includes(mode)?'返回当前项目':'返回项目列表';$('#nav').innerHTML=['catalog','editor','maintenance'].includes(mode)?button('项目列表','exit')+button('主题管理','catalog'):button('项目概览','exit')+button('项目主题','project')+button('选择主题','selection')+button('工作台 / 项目资料','exit');let html='';
if(mode==='catalog'){html=`<div class="toolbar"><p>维护候选、发布新版本，再由项目明确选择。</p><div class="actions">${button('建立来源','new',true)}${button('维护对账','maintenance')}</div></div><div class="grid"><section class="panel"><h2><span class="label">P1-M1</span>来源范围</h2>${Object.entries(sources).map(([k,v])=>`<button class="source ${scope===k?'active':''}" data-scope="${k}">${v[1].split(' · ')[0]}<small>${v[1].split(' · ')[1]}</small></button>`).join('')}${scope==='project'?'<label>来源所属项目</label><select aria-label="来源所属项目"><option>访谈研究</option></select>':''}</section><section class="panel"><h2><span class="label">P1-M2</span>${sources[scope][0]}</h2><p class="muted">${sources[scope][1]}</p><dl><dt>可选版本</dt><dd>1.0.0 · 发布于本日（合成）</dd><dt>当前候选</dt><dd>${scope==='builtin'?'内置版本只读':`修订 ${rev} · 尚未发布`}</dd><dt>使用项目</dt><dd>1 个（合成；仅有权项目）</dd></dl><div class="actions">${button(scope==='builtin'?'查看只读版本':'维护候选','editor',true)}${button('查看发布版本','versions')}${button('为项目选择','selection')}</div><div class="note">个人公共表示你自己的多个项目可复用。项目专属仅限所属项目；复用需显式复制成个人来源。</div></section></div>`;}
if(mode==='editor'){html=`<div class="toolbar"><p>${sources[scope][1]} · ${scope==='builtin'?'只读版本':'候选修改不会影响已发布版本或项目选择'}</p><div class="actions">${button('返回来源目录','catalog')}${button('复制为个人来源','copy')}</div></div><div class="grid"><section class="panel"><h2><span class="label">P2-M1</span>维护导航</h2>${button('候选定义','candidate')}${button('发布版本','versions')}<hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><h3>来源操作</h3><p class="muted">停用保留既有版本加载；安全撤回会阻止加载。</p>${scope==='builtin'?'<p class="muted">内置来源由平台发布与部署维护；复制后可维护个人来源。</p>':(sourceStates[scope]==='active'?button('停用来源','disable')+button('安全撤回','withdraw'):button(sourceStates[scope]==='disabled'?'恢复来源':'恢复撤回','restore'))}${operation?`<div class="note warning"><h3>确认${{disable:'停用来源',withdraw:'安全撤回',restore:'恢复来源'}[operation]}</h3><p>来源：${sources[scope][0]} · ${sources[scope][1]}</p><p>${operation==='disable'?'将停止新发布和新选择；1 个有权项目的既有绑定继续加载（合成）。':operation==='withdraw'?'将阻止来源所有版本加载；1 个有权项目将显示撤回原因（合成），原绑定及历史保留。':'将恢复该来源的选择与加载；不会修改项目版本或映射。'}</p>${operation==='withdraw'||(operation==='restore'&&sourceStates[scope]==='withdrawn')?'<label for="reason">原因（必填）</label><textarea id="reason" style="min-height:90px"></textarea>':''}<div class="actions">${button('取消','cancel-operation')}${button('确认操作（仅演示）','confirm-operation',true)}</div></div>`:''}</section><section class="panel">${tab==='versions'?`<h2><span class="label">P2-M4</span>不可变发布版本</h2><div class="row"><div><strong>1.0.0</strong><p class="muted">原字节包 · 3 页 · 发布者为当前维护者（合成）</p><details><summary>追溯信息</summary><p>来源身份、版本身份、ZIP 摘要、发布时间及候选修订在正式服务回读。</p></details></div><div class="actions">${button('预览此版本','preview')}${button('为项目选择','selection')}</div></div><div class="note">版本内容不可覆盖；继续维护从候选发布新版本。相同版本号、不同包字节明确冲突。</div>`:`<h2><span class="label">P2-M2</span>候选定义</h2><p class="muted">修订 ${rev} · ${dirty?'有未保存修改':'已保存（合成）'} · 预览不改变项目选择</p><div class="pair"><div><label for="name">名称</label><input id="name" value="${sources[scope][0]}" ${scope==='builtin'?'readonly':''}><label for="ver">包版本</label><input id="ver" value="1.1.0" ${scope==='builtin'?'readonly':''}></div><div><label>文件资源</label><p>survey · 项目 JSON 文件（待项目绑定）<br>distribution · 包内 PNG（随包校验）</p>${scope==='builtin'?'<p class="muted">内置包只读，资源随平台发布。</p>':button('替换候选 ZIP','replace')}</div></div><label for="definition">theme.json · 受控定义</label><textarea id="definition" ${scope==='builtin'?'readonly':''}>${JSON.stringify({id:'reading',version:'1.1.0',name:'阅读主题',topicLabel:'课题',pages:[{id:'context',title:'课题脉络',layout:'reading'}]},null,2)}</textarea><p class="muted">此处展示编辑位置；简化示意 JSON 不作为可发布契约样例。正式编辑器同时提供 manifest 与完整 theme。</p><div class="footer">${scope==='builtin'?button('复制后维护','copy',true):button('保存候选','save',true)}${button('校验','validate')}${button('隔离预览','preview')}${scope==='builtin'?'':button('发布新版本','publish')}</div>`}</section></div>`;}
if(mode==='selection'){html=`<p>选择一个已发布版本；确认后仅更新当前项目。</p><div class="pair"><section class="panel"><h2><span class="label">P3-M1</span>当前项目与选择</h2><label>项目</label><select id="project"><option ${project==='访谈研究'?'selected':''}>访谈研究</option><option ${project==='市场复核'?'selected':''}>市场复核</option></select><dl style="margin-top:20px"><dt>当前主题</dt><dd>${bound}</dd><dt>当前选择</dt><dd>第 ${generation} 次修订（合成）</dd></dl><p class="muted">演示两个项目共用目录，选择仍按项目独立保存。</p><h2><span class="label">P3-M2</span>准备选择</h2><label>发布版本</label><select id="pick">${Object.entries(choices).filter(([id])=>id!=='project-reading-v1'||project==='访谈研究').map(([id,item])=>`<option value="${id}" ${id===pick?'selected':''}>${item.label}</option>`).join('')}</select><p class="muted">目录只列当前用户及当前项目有权选择的来源。</p></section><section class="panel"><h2><span class="label">P3-M3</span>项目文件映射</h2>${Object.entries(choices[pick].files).map(([alias,type])=>`<p>${alias} 需要一个 ${type} 普通文件，属于当前项目 Workdir。</p><label for="path">项目内文件</label><input class="wide" id="path" data-alias="${alias}" value="${escapeHtml(filePaths[alias]||'')}" placeholder="选择当前项目文件">`).join('')||'<p>此版本没有项目文件要求，无需映射。</p>'}<div class="note">保存前核对归属、路径各段无符号链接、普通文件、类型与容量。内容读取留待 S05；绑定通过不表示业务已可用。</div>${pick==='builtin-default-v1'?'':'<p>distribution 为包内 PNG，无需项目映射。</p>'}<h2><span class="label">P3-M4</span>确认结果</h2><p>将 ${project} 从 ${bound} 切换到 <strong>${choices[pick].label}</strong>；其他项目与已发布字节保留。</p><p id="mapping-summary">目标文件：${Object.keys(choices[pick].files).map(alias=>`${alias} → ${escapeHtml(filePaths[alias]||'尚未绑定')}`).join('；')||'无需项目文件映射'}</p><div class="footer">${button('隔离预览','preview')}${button('保存项目选择','choose',true)}</div></section></div>`;}
if(mode==='project'){html=`<div class="toolbar"><p><span class="label">P4-M1</span>已选：${bound} · 选择修订 ${generation}（合成）</p>${button('更换主题','selection')}</div><div class="note warning">S04 页面示意：定义、包内资源与项目选择将在正式实施后真实读取；业务及项目文件内容待 S05 接通。</div>${['missing','tampered','withdrawn'].includes(state)?`<section class="panel"><h2>当前主题无法加载</h2><p>原绑定保留。可重试、显式换版本，或进入可信项目概览。</p><div class="actions">${button('重试','normal',true)}${button('选择其他版本','selection')}${button('进入原项目概览','exit')}</div></section>`:`<section class="panel"><h2><span class="label">P4-M2</span>同一 ThemeHost 的正式页面位置</h2><div class="pages">${button('课题脉络','page')}${button('证据资料','page')}${button('研究结论','page')}</div><div class="area"><h3>业务数据待 S05 接通</h3><p>不展示合成议题、决定、任务或数量。项目文件只显示已校验映射及类型，不读取其内容。</p></div><div class="area"><h3>包内资源读取区域</h3><p>正式实施从已授权版本读取原 PNG／JSON 资源；本稿不显示伪造的真实资源读取结果。</p></div></section>`}`;}
if(mode==='maintenance'){html=`<section class="panel"><h2><span class="label">P5-M1</span>有权来源的文件对账</h2><p>按需检查数据库引用及实际文件，结果包含完整未引用包、临时残留、缺包与损坏。只读检查不删除文件。</p><div class="actions">${button('运行只读对账','audit',true)}${button('查看恢复步骤','recovery')}</div><div class="row"><div><strong>完整未引用包（合成示例）</strong><p class="muted">版本登记失败；没有项目绑定</p></div>${button('清理前重新核查引用','clean')}</div><div class="note warning">真正清理走来源锁内的再次数据库查询，并避开发布中的文件。内置及其他用户来源无清理权限。</div><h2><span class="label">P5-M2</span>部署备份与恢复</h2><p>部署维护者暂停写入 → 一并备份 PostgreSQL 与主题文件域 → 恢复到隔离环境 → 对账全部被引用版本和绑定 → 再恢复服务。</p><p class="muted">部署恢复通过受控命令完成；普通用户页面只提供检查说明，不提供数据库管理按钮。</p></section>`;}
$('#content').innerHTML=controls()+notice()+html; if(['loading','empty','denied'].includes(state))$('#content').innerHTML=controls()+notice();
}
const bindings={'访谈研究':['默认管理 1.0.0',2],'市场复核':['调研阅读 1.0.0',5]};
document.addEventListener('input',e=>{if(e.target.dataset.alias){filePaths[e.target.dataset.alias]=e.target.value;const summary=$('#mapping-summary');if(summary)summary.textContent='目标文件：'+Object.keys(choices[pick].files).map(alias=>alias+' → '+(filePaths[alias]||'尚未绑定')).join('；');}if(['name','ver','definition'].includes(e.target.id))dirty=true});
document.addEventListener('change',e=>{if(e.target.id==='view'){mode=e.target.value;state='normal';render()}if(e.target.id==='pick'){pick=e.target.value;filePaths={};state='normal';render()}if(e.target.id==='project'){project=e.target.value;[bound,generation]=bindings[project];pick='builtin-research-v1';filePaths={};state='normal';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='dark'){document.body.classList.toggle('dark');return}if(b.dataset.scope){scope=b.dataset.scope;state='normal';operation='';render();return}const a=b.dataset.action;if(!a){if(b.id==='back'){mode='catalog';state='normal';render()}return}if(['catalog','editor','selection','project','maintenance'].includes(a)){mode=a;state='normal';operation=''}else if(['disable','withdraw','restore'].includes(a)&&scope!=='builtin'){operation=a;state='normal'}else if(a==='cancel-operation'){operation=''}else if(a==='confirm-operation'){const reason=$('#reason');if(reason&&!reason.value.trim()){reason.setCustomValidity('请填写原因');reason.reportValidity();return}sourceStates[scope]=operation==='disable'?'disabled':operation==='withdraw'?'withdrawn':'active';operation='';render();$('#content').insertAdjacentHTML('afterbegin','<div class="status" role="status">来源状态操作演示完成；未写真实来源，原项目绑定保留。</div>');return}else if(a==='versions'){mode='editor';tab='versions'}else if(a==='candidate')tab='candidate';else if(['normal','loading','empty','denied','invalid','conflict','missing','tampered','withdrawn','dbfail'].includes(a))state=a;else if(['replace','disable','withdraw','save','publish'].includes(a)&&scope==='builtin'){return}else if(a==='copy'||a==='new'){scope='personal';mode='editor';tab='candidate';state='normal'}else if(a==='save'){rev++;dirty=false;render();$('#content').insertAdjacentHTML('afterbegin','<div class="status" role="status">候选保存位置演示；真实持久化未执行。</div>');return}else if(a==='choose'){if(Object.keys(choices[pick].files).some(alias=>!filePaths[alias])){state='unbound';render();return}bound=choices[pick].label;generation++;bindings[project]=[bound,generation];mode='project';state='normal'}else if(a==='publish'){render();$('#content').insertAdjacentHTML('afterbegin','<div class="status warning" role="status">发布确认位置：核对冻结候选、版本与资源；发布不会自动更新项目选择。本稿未发布。</div>');return}else if(a==='preview'){render();$('#content').insertAdjacentHTML('afterbegin','<div class="previewbox" role="status"><h2>隔离预览位置</h2><p>正式实施复用 S03 ThemeHost：真实候选／版本定义及包内资源，合成业务与项目文件持续标识；此处只演示入口，不保存选择。</p></div>');return}else{const text={validate:'正式校验将在真实 parser 中检查完整契约、成员、类型、资源指纹和容量。',replace:'正式入口上传 ZIP 只替换候选；不登记发布版本、不自动选择项目。',disable:'停用确认：停止新发布与新选择；既有版本仍可加载。',withdraw:'安全撤回确认：需填写原因；所有已绑定项目将显示加载拒绝；绑定与历史保留。',audit:'正式对账将读取授权来源、数据库引用和实际文件；本稿未执行。',clean:'正式清理将持锁重查引用；本稿未删除任何文件。',recovery:'恢复步骤由部署维护命令执行；需核对 PG、被引用 ZIP 及项目绑定。',exit:'可信平台／项目入口将在正式路由返回。本稿未离开页面。',page:'此处只演示正式 ThemeHost 的页面导航位置。'}[a];render();$('#content').insertAdjacentHTML('afterbegin',`<div class="status" role="status">${text}</div>`);return}render()});render();
</script></html>
