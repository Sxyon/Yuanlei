:root {
  --scrollbar-width: 4px;
}

/* 全局滚动条样式 */
::-webkit-scrollbar {
  width: var(--scrollbar-width);
  height: var(--scrollbar-width);
}

::-webkit-scrollbar-track {
  background: var(--gray-100);
  border-radius: calc(var(--scrollbar-width) / 2);
}

::-webkit-scrollbar-thumb {
  background: var(--gray-200);
  border-radius: calc(var(--scrollbar-width) / 2);
  transition: background 0.2s ease;
  cursor: pointer;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gray-100);
}

/* Firefox 滚动条样式 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--gray-200) transparent;
}

/* Page Padding 响应式断点 */
@media (max-width: 767px) {
  :root {
    --page-padding: 14px;
  }
}

(--color-warning-50);color:var(--color-warning-900)}.tag.info{background:var(--color-info-50);color:var(--color-info-700)}.tag.success{background:var(--color-success-50);color:var(--color-success-700)}.meta{font-size:12px;color:var(--color-text-secondary);margin-top:10px}.toolbar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}.toolbar label{flex:1;min-width:160px}.masterdetail{align-items:start;display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.6fr);gap:24px}.choices{display:flex;flex-direction:column;gap:8px}.choice{padding:16px;text-align:left;white-space:normal}.choice[aria-pressed=true]{border-color:var(--main-color);background:var(--main-10)}.choice .tag{display:inline-block;margin-top:8px}.choice p{font-size:13px;color:var(--color-text-secondary);margin-top:6px}.prose{max-width:740px}.prose p{margin:12px 0 20px}.sectionline{border-top:1px solid var(--gray-150);padding-top:20px;margin-top:24px}.timeline{padding-left:18px;border-left:2px solid var(--gray-150);margin-top:20px}.timeline article{margin-bottom:24px}.timeline p{margin:6px 0}.objecttable{width:100%;border-collapse:collapse}.objecttable th{text-align:left;color:var(--color-text-secondary);font-weight:500;font-size:12px;padding:12px 8px;border-bottom:1px solid var(--gray-150)}.objecttable td{padding:16px 8px;vertical-align:top;border-bottom:1px solid var(--gray-100)}.objecttable td:first-child{width:44%}.tablewrap{overflow:auto}.empty{padding:32px 20px;background:var(--gray-25);border-radius:6px;line-height:1.8}.error{border-left:3px solid var(--color-error-500);background:var(--color-error-50);color:var(--color-error-700)}.empty button{margin-top:12px}.filedata{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.filedata div{background:var(--gray-25);padding:16px;border-radius:6px}.filedata strong{display:block;font-size:22px}.chart{max-width:100%;height:auto;border:1px solid var(--gray-150);border-radius:6px}.focusnote{margin:16px 0;padding:12px 16px;background:var(--gray-25);border-left:2px solid var(--main-color)}.back{margin-bottom:24px}.detail dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px}.detail dd{margin:0;overflow-wrap:anywhere}.detail dt{color:var(--color-text-secondary)}code,pre{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}pre{background:var(--gray-25);padding:16px;white-space:pre-wrap;max-height:300px;overflow:auto}.prototype-controls{margin-top:32px;padding-top:20px;border-top:1px solid var(--gray-150)}.prototype-controls summary{cursor:pointer;color:var(--color-text-secondary)}.prototype-controls>div{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}.mobile-menu{display:none}.long{overflow-wrap:anywhere}footer{margin-top:32px;color:var(--color-text-secondary);font-size:12px}

<body><div class="platform"><aside class="rail" aria-label="平台导航示意"><div class="brand">元</div><span>对话</span><span class="current">项目</span><span>知识库</span><span>督查</span></aside><div class="app">
<header class="reviewbar"><strong>DB-S03 · R1 设计审阅</strong><span class="muted">六页／同一对象／两种组织方式</span><div class="actions"><a href="page-relations.html">查看关系图</a><button id="dark" aria-pressed="false">深色</button><button id="numbers" aria-pressed="true">隐藏模块编号</button></div></header>
<div class="preview-note" role="status">隔离设计原型 · 全部业务与文件为合成数据 · 详情只读，不产生保存或批准。</div>
<header class="projectbar"><button class="mobile-menu" id="menu" aria-expanded="false">项目导航</button><label><span class="module">M0</span>预览项目<select id="project"><option value="p1">市场进入研究</option><option value="p2">服务体验改进</option></select></label><label class="right">主题<select id="theme"><option value="default">默认 · 日常管理</option><option value="research">调研 · 依据阅读</option></select></label></header>
<div class="workspace"><nav id="nav" class="projectnav" aria-label="项目主题页面"></nav><main id="main" class="main"></main></div></div></div>
<script>
// 设计审阅使用固定合成对象；没有平台 API、认证或业务写操作。
const baseTopics=[{id:'topic-entry',title:'是否进入区域 A 市场',summary:'核对需求强度、服务成本与进入条件，形成小规模试点建议。',expected_outcome:'给出进入或延后建议，并明确可证伪条件。',admission_status:'canonical',progress:'decided',execution_hint:'normal'},{id:'topic-pricing',title:'试点定价与服务边界',summary:'明确试点服务包含哪些工作，避免将交付范围与长期承诺混淆。',expected_outcome:'比较两个价格方案，列明尚未核实的假设。',admission_status:'canonical',progress:'open',execution_hint:'normal'},{id:'topic-channel',title:'渠道合作的长期职责、证据归属与跨区域服务交付条件应如何界定',summary:'长标题边界案例；当前仍在讨论，尚未形成正式决定。',expected_outcome:'明确各方职责与退出条件。',admission_status:'proposed',progress:'open',execution_hint:'normal'}];
const projects={p1:{id:'p1',name:'市场进入研究',description:'研究区域 A 的进入条件，以证据形成决定，跟踪试点验证。'},p2:{id:'p2',name:'服务体验改进',description:'评估支持流程，以观察资料讨论服务改进方案。'}};
const labels={open:'研讨中',decided:'已形成决策',canonical:'已纳入',proposed:'待纳入',approved:'已批准',superseded:'已被替代',in_progress:'进行中',blocked:'受阻',todo:'待开始',done:'已完成'};
const pages={default:[['dashboard','Dashboard','先看需要关注的正式工作，再核对议题与决定。'],['workbench','工作台','选择议题，查看讨论上下文与关联正式任务。'],['topics','议题列表','按议题查看纳入状态、研讨进展和对象关联。']],research:[['context','课题脉络','从研究问题开始，沿讨论、证据和决定理解当前判断。'],['evidence','证据资料','按当前课题阅读指定资料；资料本身不代表批准。'],['conclusions','研究结论','区分正式决定、历史依据与后续验证任务。']]};
let state={project:'p1',theme:'default',page:'dashboard',selected:'topic-entry',filter:'',search:'',scenario:'ready',detail:null};let numbered=true,sequence=0;let returnContext=null;
const main=document.querySelector('#main');const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s)=>`<span class="tag ${['blocked','proposed'].includes(s)?'warning':s==='approved'?'success':s==='in_progress'?'info':''}">${labels[s]||s}</span>`;
const module=n=>numbered?`<span class="module">${n}</span>`:'';
function data(){const project=projects[state.project];const result={project,topics:baseTopics.map((t,i)=>({...t,project_id:project.id,title:state.project==='p2'?['是否增加异步服务支持','支持响应时段与范围',t.title][i]:t.title})),decisions:[{id:'decision-pilot',project_id:project.id,topic_id:'topic-entry',title:'批准开展限定范围试点',conclusion:'先验证小规模需求，试点通过后再讨论扩大范围。',rationale:'样本仍有限；以回访资料检验投入与收益。',status:'approved',revision_number:2},{id:'decision-old',project_id:project.id,topic_id:'topic-entry',title:'初步方案：直接扩大投入',conclusion:'该方案已被后续决定替代。',rationale:'历史依据保留供对照。',status:'superseded',revision_number:1},{id:'decision-independent',project_id:project.id,topic_id:null,title:'保持研究资料可追溯',conclusion:'统一记录资料来源与局限，便于复核。',rationale:'项目级决定，不关联特定议题。',status:'approved',revision_number:1}],workTasks:[{id:'work-interviews',project_id:project.id,topic_id:'topic-entry',source_decision_id:'decision-pilot',source_decision_revision:1,number:'DEMO-RES-000001',title:'完成试点客户回访与验证报告',description:'核对样本偏差，提交可回读的验证资料。',status:'in_progress',due_date:'2026-10-16'},{id:'work-cost',project_id:project.id,topic_id:'topic-pricing',source_decision_id:null,source_decision_revision:null,number:'DEMO-RES-000002',title:'核对试点服务成本',description:'服务时长估计缺少依据，等待补充。',status:'blocked',due_date:'2026-10-14'}]};if(project.id==='p2'){for(const xs of [result.topics,result.decisions,result.workTasks])for(const o of xs){o.id='p2-'+o.id;if(o.topic_id)o.topic_id='p2-'+o.topic_id;if(o.source_decision_id)o.source_decision_id='p2-'+o.source_decision_id;}}return result;}
const link=(type,o)=>o?`<button class="link" data-object="${type}" data-id="${o.id}">${escape(o.title)}</button>`:'<span class="muted">关联对象不在当前集合，详情读取需重新核实。</span>';
const row=(type,o,description)=>`<article class="row"><div class="rowhead">${link(type,o)}${badge(o.status||o.progress)}</div><p>${escape(description||o.summary||o.description||o.conclusion)}</p></article>`;
const panel=(n,title,content,action='')=>`<section class="panel"><header><h2>${module(n)}${title}</h2>${action}</header>${content}</section>`;
const topicPicker=(d)=>`<div class="choices" aria-label="选择${state.theme==='research'?'课题':'议题'}">${d.topics.map(t=>`<button class="choice" data-select="${t.id}" aria-pressed="${state.selected===t.id}"><strong>${escape(t.title)}</strong><p>${escape(t.summary)}</p>${badge(t.progress)}</button>`).join('')}</div>`;
function discussion(t){return `<div class="timeline"><article><small>10月10日 · 研究意见 · 合成</small><p>${t.id.endsWith('topic-entry')?'目前证据支持开展有限试点，样本量不足以支持全面进入。':'先补充成本资料，再判断价格或职责是否合理。'}</p></article><article><small>10月12日 · 待核实事项 · 合成</small><p>需要补充不同服务规模下的成本边界。</p></article></div><button class="link" data-object="topic" data-id="${t.id}">查看${state.theme==='research'?'课题':'议题'}详情与完整上下文 →</button>`;}
function evidence(){if(['missing','unbound','error','denied'].includes(state.scenario))return `<div class="empty ${['error','denied'].includes(state.scenario)?'error':''}" role="${state.scenario==='error'?'alert':'status'}"><h3>${{missing:'指定资料文件缺失',unbound:'尚未绑定指定资料',error:'资料读取失败',denied:'无权读取当前资料'}[state.scenario]}</h3><p>${{missing:'当前绑定指向的文件不存在，保留资料名称供核对。',unbound:'S04 可在有权项目中选择文件；此原型不保存绑定。',error:'请求失败，不能将失败当作空资料。',denied:'权限错误时清空资料内容，不显示旧项目缓存。'}[state.scenario]}</p><button data-retry>恢复正常示例</button></div>`;return `<p class="muted">合成指定文件 · application/json · alias: survey</p><div class="filedata"><div><small>访谈样本</small><strong>24 份</strong></div><div><small>愿意进入试点</small><strong>15 份</strong></div></div><p>样本来自合成访谈，用于讨论试点条件，不能直接推导市场规模。</p><details class="sectionline"><summary>查看资料 JSON 原文</summary><pre>${escape(JSON.stringify({kind:'synthetic',sample_count:24,pilot_interest:15,limitations:['样本有限','未核实付费意愿']},null,2))}</pre></details>`;}
function renderPage(d){const t=d.topics.find(t=>t.id===state.selected)||d.topics[0];const ds=d.decisions.filter(x=>x.topic_id===t.id),tasks=d.workTasks.filter(x=>x.topic_id===t.id);switch(state.page){
case 'dashboard':return `<div class="stats" aria-label="合成业务摘要"><div class="stat"><small>${module('D1')}正式任务</small><strong>2</strong><small>1 项受阻，需补充依据</small></div><div class="stat"><small>当前议题</small><strong>3</strong><small>2 项已纳入，1 项待纳入</small></div><div class="stat"><small>有效决定</small><strong>${d.decisions.filter(x=>x.status==='approved').length}</strong><small>1 项历史决定保留</small></div></div><div class="grid"><div class="stack">${panel('D2','需要关注的工作',d.workTasks.slice().sort((a,b)=>Number(b.status==='blocked')-Number(a.status==='blocked')).map(x=>row('workTask',x)).join(''),'<button class="link" data-page="workbench">进入工作台 →</button>')}${panel('D3','当前议题',d.topics.slice(0,2).map(x=>row('topic',x)).join(''),'<button class="link" data-page="topics">全部议题 →</button>')}</div><div class="stack">${panel('D4','近期有效决定',row('decision',d.decisions[0]))}${panel('D5','项目目标',`<p>${escape(d.project.description)}</p><p class="meta">先验证，后扩大；不从任务报告推断完成。</p>`)}</div></div>`;
case 'workbench':return `<div class="masterdetail">${panel('W1','选择议题',topicPicker(d))}<div class="stack">${panel('W2','讨论上下文',`<h3>${escape(t.title)}</h3>${discussion(t)}`)}${panel('W3','关联正式任务',tasks.length?tasks.map(x=>row('workTask',x)).join(''):'<div class="empty">当前议题暂无正式任务；讨论意见不会自动成为正式任务。</div>')}${panel('W4','关联决定',ds.length?ds.map(x=>row('decision',x)).join(''):'<p class="muted">尚未形成决定。</p>')}</div></div>`;
case 'topics':{const ts=d.topics.filter(x=>(!state.filter||x.progress===state.filter)&&x.title.includes(state.search));return panel('L1','议题与关联',`<div class="toolbar"><label>搜索<input id="search" value="${escape(state.search)}" placeholder="搜索议题标题"></label><label>进展<select id="filter"><option value="">全部</option><option value="open" ${state.filter==='open'?'selected':''}>研讨中</option><option value="decided" ${state.filter==='decided'?'selected':''}>已形成决策</option></select></label></div><div class="tablewrap"><table class="objecttable"><thead><tr><th>议题</th><th>纳入／进展</th><th>决定</th><th>正式任务</th></tr></thead><tbody>${ts.map(x=>`<tr><td>${link('topic',x)}<p class="meta">${escape(x.summary)}</p></td><td>${badge(x.admission_status)}<p>${badge(x.progress)}</p></td><td>${d.decisions.filter(y=>y.topic_id===x.id&&y.status==='approved').map(y=>link('decision',y)).join('')||'尚无'}</td><td>${d.workTasks.filter(y=>y.topic_id===x.id).map(y=>link('workTask',y)).join('')||'尚无'}</td></tr>`).join('')}</tbody></table></div>${ts.length?'':'<div class="empty">没有匹配议题；请调整搜索或进展筛选。</div>'}`);}
case 'context':return `<div class="masterdetail">${panel('R1','课题目录',topicPicker(d))}<div class="stack">${panel('R2','研究问题',`<div class="prose"><h3>${escape(t.title)}</h3><p>${escape(t.summary)}</p><small>预期产出</small><p>${escape(t.expected_outcome)}</p><div class="focusnote">“课题”是议题的显示名称，当前进展：${labels[t.progress]}。</div></div>${discussion(t)}`)}${panel('R3','证据与判断',`<p>访谈资料是本课题的示例依据。资料关联来自合成适配器，正式关系将在真实数据接通时核实。</p><p class="sectionline"><button class="link" data-page="evidence">阅读课题资料 →</button></p>${ds.filter(x=>x.status==='approved').map(x=>row('decision',x)).join('')||'<p class="meta">当前暂无正式决定。</p>'}`)}</div></div>`;
case 'evidence':return `<div class="masterdetail">${panel('E1','资料索引',`<label>当前课题<select id="topic-file">${d.topics.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${escape(x.title)}</option>`).join('')}</select></label><div class="sectionline"><h3>访谈汇总</h3><p class="muted">指定文件 · JSON · 合成</p></div><div class="sectionline"><h3>访谈意向分布</h3><p class="muted">包内资源 · PNG · 合成</p></div><p class="meta">课题用于阅读上下文；本示例资料为项目共享，不假造逐课题文件关系。</p>`)}<div class="stack">${panel('E2','访谈汇总',evidence())}${panel('E3','访谈意向分布',state.scenario==='ready'?`<img class="chart" src="synthetic-survey.png" alt="合成24份访谈：15份愿意试点、6份仍需评估、3份暂不参与"><p class="meta">合成 PNG · 包内示例资源。图像描述提供相同数据。</p>`:'<p class="muted">此状态示例暂停图像显示，避免误读旧内容。</p>')}${panel('E4','阅读上下文',`<p>当前课题：${link('topic',t)}</p><p class="meta">资料不能替代议题事实；进入详情后返回资料页及原选择。</p>`)}</div></div>`;
case 'conclusions':return `<div class="grid"><div class="stack">${panel('C1','正式结论',`<p class="muted">结论来自决定对象，批准状态按原 DTO 展示。</p>${d.decisions.filter(x=>x.status==='approved').map(x=>`<article class="row"><div class="rowhead">${link('decision',x)}${badge(x.status)}</div><p>${escape(x.conclusion)}</p><div class="sectionline"><small>判断依据</small><p>${escape(x.rationale)}</p><p>来源课题：${x.topic_id?link('topic',d.topics.find(t=>t.id===x.topic_id)):'<span class="muted">无来源议题 · 项目级决定</span>'}</p></div></article>`).join('')}`)}${panel('C2','历史依据',`<details><summary>查看已被替代的决定（1）</summary>${row('decision',d.decisions[1])}</details>`)}</div>${panel('C3','后续验证任务',`<p class="muted">正式任务保持原编号、状态与来源决定。</p>${d.workTasks.map(x=>row('workTask',x)).join('')}<p class="meta">进行中 ≠ 已完成；查看详情核对交付与验收。</p>`)}</div>`;}}
function render(){const toolsOpen=Boolean(main.querySelector(".prototype-controls[open]"));const d=data();document.querySelector('#project').value=state.project;document.querySelector('#theme').value=state.theme;const nav=document.querySelector('#nav');nav.innerHTML=`<p>${module('M1')}主题页面</p>${pages[state.theme].map(([id,title])=>`<button data-page="${id}" aria-current="${state.page===id?'page':'false'}">${title}</button>`).join('')}<div class="secondary"><p>可信项目入口</p><button data-boundary="工作任务">工作任务 ↗</button><button data-boundary="项目资料">项目资料 ↗</button><button data-boundary="项目列表">← 项目列表</button></div>`;
if(state.detail){renderDetail(d);return;}const p=pages[state.theme].find(x=>x[0]===state.page);main.innerHTML=`<header class="intro"><div><div class="kicker">${module('M2')}${state.theme==='default'?'日常管理':'课题调研'} / ${escape(d.project.name)}</div><h1>${p[1]}</h1><p>${p[2]}</p></div></header><div id="content">${state.scenario==='loading'?'<div class="empty" role="status">正在读取合成页面…</div>':state.scenario==='empty'?'<div class="empty" role="status"><h3>当前项目尚无业务记录</h3><p>预览可以恢复合成示例；真实页面需回原业务入口创建。</p><button data-retry>恢复正常示例</button></div>':renderPage(d)}</div><details class="prototype-controls" ${toolsOpen?'open':''}><summary>审阅工具：查看空错、加载与迟到响应</summary><div><label>状态<select id="scenario">${[['ready','正常'],['loading','加载中'],['empty','空数据'],['missing','缺文件（资料页）'],['unbound','未绑定（资料页）'],['error','读取错误（资料页）'],['denied','权限错误（资料页）']].map(([v,l])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${l}</option>`).join('')}</select></label><button id="delay">模拟迟到数据：随后切换上下文</button><button id="delay-error">模拟迟到错误：随后切换上下文</button></div><p id="delay-status" class="meta" role="status"></p></details><footer>R1 候选布局 · 模块编号可隐藏 · 平台外壳为布局示意，产品实施复用现有 AppLayout／PageHeader。</footer>`;}
function renderDetail(d){const type=state.detail.type;const collection={topic:d.topics,decision:d.decisions,workTask:d.workTasks}[type];const o=collection?.find(x=>x.id===state.detail.id);if(!o){main.innerHTML='<div class="empty error" role="alert">对象不存在于当前合成项目。</div>';return;}main.innerHTML=`<button class="back" data-back>← 返回 ${pages[state.theme].find(x=>x[0]===state.page)[1]}</button>${panel('M3',`${{topic:'议题',decision:'决定',workTask:'正式任务'}[type]}详情 · 合成只读`, `<h1>${escape(o.title)}</h1><div class="focusnote">${badge(o.status||o.progress)} · 此处仅展示原对象语义，无批准、保存或完成操作。</div><dl><dt>项目</dt><dd>${escape(d.project.name)} <code>${o.project_id}</code></dd><dt>对象身份</dt><dd><code>${type}:${o.id}</code></dd>${o.number?`<dt>正式编号</dt><dd>${o.number}</dd>`:''}<dt>内容</dt><dd>${escape(o.conclusion||o.summary||o.description)}</dd>${o.topic_id?`<dt>来源议题</dt><dd>${link('topic',d.topics.find(x=>x.id===o.topic_id))}</dd>`:''}${o.source_decision_id?`<dt>来源决定</dt><dd>${link('decision',d.decisions.find(x=>x.id===o.source_decision_id))}<p class="meta">任务来源版本 ${o.source_decision_revision} · 当前决定版本 ${d.decisions.find(x=>x.id===o.source_decision_id)?.revision_number??'未读取'}。此入口查看当前决定；当次依据版本须单独核对。</p><details class="sectionline"><summary>查看任务来源版本（合成历史）</summary><p>第 ${o.source_decision_revision} 版：限定访谈验证范围，先提交验证资料再讨论扩大投入。历史内容为合成快照，不能由当前决定正文替代。</p></details></dd>`:''}</dl><p class="meta">对象链接可继续钻取；统一返回最初来源页，保留选择、搜索、筛选与滚动。</p>`)} `;main.classList.add('detail');main.querySelector('[data-back]').focus();}
function changeContext(change){sequence++;state={...state,...change,detail:null};returnContext=null;main.classList.remove('detail');render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){changeContext({page:b.dataset.page,scenario:'ready'});document.querySelector('#nav').classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false');main.querySelector('h1').setAttribute('tabindex','-1');main.querySelector('h1').focus();}if(b.dataset.select)changeContext({selected:b.dataset.select});if(b.dataset.object){sequence++;if(!returnContext)returnContext={state:{...state},top:window.scrollY,object:b.dataset.id};state.detail={type:b.dataset.object,id:b.dataset.id};render();window.scrollTo(0,0);}if(b.hasAttribute('data-back')){const c=returnContext;state=c.state;returnContext=null;main.classList.remove('detail');render();window.scrollTo(0,c.top);main.querySelector(`[data-id="${c.object}"]`)?.focus({preventScroll:true});}if(b.hasAttribute('data-retry'))changeContext({scenario:'ready'});if(b.dataset.boundary){main.innerHTML=`<button data-prototype-back>← 返回预览</button><div class="empty sectionline">${b.dataset.boundary}是平台可信入口。此隔离原型不跳到真实项目，不查询或修改日常数据。</div>`;}if(b.hasAttribute('data-prototype-back'))render();if(b.id==='dark'){const on=document.documentElement.classList.toggle('dark');b.textContent=on?'浅色':'深色';b.setAttribute('aria-pressed',on);}if(b.id==='numbers'){numbered=!numbered;b.textContent=numbered?'隐藏模块编号':'显示模块编号';b.setAttribute('aria-pressed',numbered);render();}if(b.id==='menu'){const open=document.querySelector('#nav').classList.toggle('open');b.setAttribute('aria-expanded',open);}if(b.id==='delay'||b.id==='delay-error'){const captured=++sequence;const snapshot={project:data().project,page:state.page,selected:state.selected,error:b.id==='delay-error'};document.querySelector('#delay-status').textContent='合成请求等待 2 秒；现在可切换项目、主题或议题。';setTimeout(()=>{if(captured!==sequence){document.querySelector('#delay-status')?.replaceChildren(document.createTextNode('旧请求已丢弃，当前页面未被覆盖。'));return;}document.querySelector('#content').innerHTML=`<div data-delayed-payload class="empty ${snapshot.error?'error':''}" role="${snapshot.error?'alert':'status'}">${snapshot.error?'合成请求失败':'合成响应已接收'}：${escape(snapshot.project.name)} / ${escape(snapshot.page)} / ${escape(snapshot.selected)}<p>这是捕获的旧上下文 DTO／错误；正确隔离时仅在上下文未改变时显示。</p><button data-retry>恢复正常示例</button></div>`;document.querySelector('#delay-status').textContent='响应已提交到捕获的页面上下文。';},2000);}});
document.addEventListener('change',e=>{if(e.target.id==='project')changeContext({project:e.target.value,page:pages[state.theme][0][0],selected:e.target.value==='p2'?'p2-topic-entry':'topic-entry',search:'',filter:'',scenario:'ready'});if(e.target.id==='theme')changeContext({theme:e.target.value,page:pages[e.target.value][0][0],search:'',filter:'',scenario:'ready'});if(e.target.id==='topic-file')changeContext({selected:e.target.value});if(e.target.id==='scenario')changeContext({scenario:e.target.value,page:['missing','unbound','error','denied'].includes(e.target.value)?'evidence':state.page,theme:['missing','unbound','error','denied'].includes(e.target.value)?'research':state.theme});if(e.target.id==='filter')changeContext({filter:e.target.value});if(e.target.id==='search'){const value=e.target.value;changeContext({search:value});main.querySelector('#search').focus();}});
render();
</script></body></html>
