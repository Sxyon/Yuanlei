function iconControl(label,kind,attrs='',selected=false){return `<button class="icon-control ${selected?'chosen':''}" aria-label="${label}" title="${label}" ${attrs}>${glyph(kind)}</button>`;}
function truncate(text,max){const c=Array.from(text);return c.length>max?c.slice(0,max-1).join('')+'…':text;}
function bpSelected(){return bpDocuments.find(d=>d.id===state.selectedBlueprint)||bpDocuments[0];}
function blueprintText(doc){const old=state.historyVersion&&doc.id===state.selectedBlueprint?doc.history.find(h=>h.version===state.historyVersion):null;return old?old.content:doc.content;}
function blueprintArticle(doc,drawer=false){const editing=state.bpEditing===doc.id&&!state.historyVersion,collapsed=drawer&&state.bpCollapsed.has(doc.id);return `<article class="blueprint-sheet ${drawer?'drawer-sheet':''}" id="bp-${doc.id}" data-bp-id="${doc.id}"><header class="blueprint-sheet-head">${drawer?`<button class="drawer-title" data-bp-collapse="${doc.id}" aria-expanded="${!collapsed}">${glyph('down')}<span>${escape(doc.title)}</span></button>`:`<h1>${escape(doc.title)}</h1>`}<div class="blueprint-modes">${iconControl('阅览','read',`data-bp-read="${doc.id}" aria-pressed="${!editing}"`,!editing)}${iconControl('编辑','edit',`data-bp-edit="${doc.id}" aria-pressed="${editing}" ${state.historyVersion?'disabled':''}`,editing)}<details class="popover more-pop"><summary aria-label="更多" title="更多">${glyph('more')}</summary><div class="pop-menu"><button data-action="重命名蓝图">重命名</button><button data-action="归档蓝图">归档</button><button data-action="删除蓝图" class="danger">删除</button></div></details></div></header>${collapsed?'':`<div class="blueprint-body">${state.historyVersion&&doc.id===state.selectedBlueprint?`<div class="version-note">历史 ${escape(state.historyVersion)} · 只读 <button class="text-link" data-bp-return aria-label="返回查看历史前的位置">← 返回</button></div>`:''}${editing?`<label class="sr-only" for="bp-editor-${doc.id}">编辑${escape(doc.title)}</label><textarea class="blueprint-editor" id="bp-editor-${doc.id}" data-bp-draft="${doc.id}">${escape(state.bpDrafts[doc.id]??doc.content)}</textarea><div class="inline-save">${act('保存','保存蓝图演示','primary')}<span class="muted">草稿仅在本页演示内存，未写入文件。</span></div>`:`${Object.hasOwn(state.bpDrafts,doc.id)?'<p class="draft-note">有未保存的演示草稿，切换编辑可继续。</p>':''}<div class="doc blueprint-prose">${blueprintText(doc).split('\n\n').map(text=>`<p>${escape(text).replaceAll('\n','<br>')}</p>`).join('')}</div>`}</div>`}</article>`;}
function activityRows(){const events=[
{id:'history-1',type:'history',time:'09:10',body:'项目维护者创建了议题'},
{id:'discussion-1',type:'discussion',time:'09:25',author:'项目维护者',snippet:'全部项目页面都应该通过主题组织，不只是导航。',body:'蓝图、行动计划、督查及准确对象办理也要留在当前主题中。信息需要分层，避免将所有字段和操作平铺。',replies:2},
{id:'history-2',type:'history',time:'09:42',body:'正文从 v2 修订为 v3'},
{id:'execution-1',type:'execution',time:'10:05',title:'实现全项目主题工作区',body:'正式工作 · 验收条件 v3 · 来源决定 v1',status:'待验收'},
{id:'discussion-2',type:'discussion',time:'10:24',author:'设计智能体',snippet:'建议让正文持续可读，决策收在正文下方，动态按时间呈现。',body:'讨论以可折叠回复呈现，历史操作保持一行，工作作为独立块嵌在动态中。筛选动态不应让正文消失。',replies:1},
{id:'history-3',type:'history',time:'10:31',body:'关联决定 v1 获批准（不自动完成议题或工作）'}
];events.push(...state.postedReplies);let shown=events.filter(e=>state.activityFilter==='all'||state.activityFilter===e.type);if(state.activityOrder==='desc')shown.reverse();return shown.map(event=>{if(event.id.startsWith('discussion-new-'))return `<details class="discussion-thread posted-reply" data-thread-id="${event.id}" id="event-${event.id}" ${state.threadExpanded.has(event.id)?'open':''}><summary><span class="avatar">人</span><strong>项目维护者</strong><time>刚刚 · 演示</time><span class="thread-preview">${escape(truncate(event.body,60))}</span></summary><div class="thread-body"><p>${escape(event.body)}</p></div></details>`;if(event.type==='history')return `<div class="event-history" id="event-${event.id}"><span class="event-mark" aria-hidden="true">·</span><span>${event.body}</span><time>${event.time}</time></div>`;if(event.type==='execution')return `<article class="event-work" id="event-${event.id}"><div class="event-work-top"><span>工作</span><time>${event.time}</time></div><a href="#task" class="object-title" data-nav="task">${event.title}</a><p>${event.body}</p>${status(event.status)}</article>`;return `<details class="discussion-thread" id="event-${event.id}" data-thread-id="${event.id}" ${state.threadExpanded.has(event.id)?'open':''}><summary><span class="avatar">${event.author==='项目维护者'?'人':'AI'}</span><strong>${event.author}</strong><time>${event.time}</time><span class="thread-preview">${event.snippet}</span><span class="reply-count">${event.replies} 条回复</span></summary><div class="thread-body"><p>${event.body}</p><div class="thread-reply"><strong>${event.author==='项目维护者'?'设计智能体':'项目维护者'}</strong><p>${event.author==='项目维护者'?'认可。下一版会把内容和操作安排在同一主题中，按场景组织。':'按这个方向继续，先验证层次和阅读密度。'}</p></div>${act('回复','回复讨论','quiet')}</div></details>`;}).join('');}
function handleR3Click(e){const t=e.target;const filter=t.closest('[data-plan-filter]');if(filter){state.planFilter=filter.dataset.planFilter;render();return true;}if(t.closest('.bp-switch')){const box=t.closest('.bp-select');const open=box?.classList.toggle('open');if(box)box.dataset.dismissed='false';box?.querySelector('.bp-switch')?.setAttribute('aria-expanded',String(open));return true;}let target=t.closest('[data-bp-pick]');if(target){e.preventDefault?.();if(state.dirty&&!confirm('切换后保留当前演示草稿，是否继续？'))return true;state.selectedBlueprint=target.dataset.bpPick;state.historyVersion=null;state.bpHistoryReturn=null;state.bpEditing=null;state.dirty=false;state.bpCollapsed.delete(state.selectedBlueprint);state.page='blueprint';render();if(state.blueprintMode==='drawer')document.querySelector('#bp-'+state.selectedBlueprint)?.scrollIntoView?.({block:'start',behavior:'smooth'});return true;}
 target=t.closest('[data-bp-mode]');if(target){state.blueprintMode=target.dataset.bpMode;state.historyVersion=null;render();return true;}
 target=t.closest('[data-bp-edit]');if(target){state.historyVersion=null;state.bpEditing=target.dataset.bpEdit;state.selectedBlueprint=state.bpEditing;state.bpCollapsed.delete(state.bpEditing);render();document.querySelector('#bp-editor-'+state.bpEditing)?.focus();return true;}
 target=t.closest('[data-bp-read]');if(target){state.selectedBlueprint=target.dataset.bpRead;state.bpEditing=null;state.dirty=false;render();return true;}
 target=t.closest('[data-bp-collapse]');if(target){const id=target.dataset.bpCollapse;if(state.bpCollapsed.has(id))state.bpCollapsed.delete(id);else state.bpCollapsed.add(id);render();return true;}
 target=t.closest('[data-bp-history]');if(target){if(state.dirty&&!confirm('当前草稿保留为演示草稿，是否读取历史？'))return true;if(!state.historyVersion)state.bpHistoryReturn={page:state.page,selectedBlueprint:state.selectedBlueprint,blueprintMode:state.blueprintMode,bpEditing:state.bpEditing,bpCollapsed:new Set(state.bpCollapsed),dirty:state.dirty,scrollY:window.scrollY||0};state.bpEditing=null;state.dirty=false;state.blueprintMode='detail';state.historyVersion=target.dataset.bpHistory;render();return true;}
 if(t.closest('[data-bp-return]')){const origin=state.bpHistoryReturn;state.historyVersion=null;state.bpHistoryReturn=null;if(origin){state.page=origin.page;state.selectedBlueprint=origin.selectedBlueprint;state.blueprintMode=origin.blueprintMode;state.bpEditing=origin.bpEditing;state.bpCollapsed=new Set(origin.bpCollapsed);state.dirty=origin.dirty;}render();window.scrollTo(0,origin?.scrollY||0);document.querySelector('#bp-history-toggle')?.focus({preventScroll:true});return true;}
 if(t.closest('[data-bp-current]')){state.historyVersion=null;render();return true;}
 target=t.closest('[data-activity-filter]');if(target){state.activityFilter=target.dataset.activityFilter;render();return true;}
 target=t.closest('[data-focus-event]');if(target){e.preventDefault?.();state.page='topic';state.activityFilter='all';const id=target.dataset.focusEvent;state.threadExpanded.add(id);render();document.querySelector('#event-'+id)?.scrollIntoView?.({block:'center'});return true;}
 target=t.closest('[data-focus-decision]');if(target){e.preventDefault?.();state.page='topic';state.decisionExpanded.add('decision-1');render();const group=document.querySelector('#topic-decisions');if(group)group.open=true;document.querySelector('#decision-1')?.scrollIntoView?.({block:'center'});return true;}
 target=t.closest('[data-action="保存蓝图演示"]');if(target){const id=state.bpEditing,doc=bpDocuments.find(x=>x.id===id);if(doc){const body=state.bpDrafts[id]??doc.content;if(!body.trim()){toast('正文不能为空');return true;}doc.history.unshift({version:'v'+(doc.history.length+1),time:'刚刚 · 演示',content:doc.content});doc.content=body;delete state.bpDrafts[id];state.bpEditing=null;state.dirty=false;render();toast('已保存到演示内存；未写入项目文件');}return true;}
 return false;}

function escape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hide'),4000);}
function navigate(p){if(state.dirty&&!confirm('演示草稿尚未保存。确定离开？'))return;state.dirty=false;state.page=p;state.scenario='ready';document.querySelector('#scenario').value='ready';render();document.querySelector('#shell').classList.remove('navopen');document.querySelector('#mobilemenu').setAttribute('aria-expanded','false');document.querySelector('#content').focus();window.scrollTo(0,0);}

function panel(title,body,action=''){return `<section class="panel"><div class="panelhead"><h2>${title}</h2>${action}</div>${body}</section>`}
function row(title,desc,tag,nav='topic'){return `<article class="row"><a class="body row-target" href="#${nav}" data-nav="${nav}"><h3>${escape(title)}</h3><p>${escape(desc)}</p></a>${status(tag)}</article>`;}

function blueprint(){const doc=bpSelected();return `<div class="blueprint-space"><div class="page-tools blueprint-tools" data-area="M2 蓝图选择与操作"><div class="bp-select"><button aria-label="切换蓝图" aria-haspopup="true" aria-expanded="false" class="bp-switch">${glyph('detail')}<span>${escape(doc.title)}</span>${glyph('down')}</button><div class="pop-menu">${bpDocuments.map(d=>`<button data-bp-pick="${d.id}" ${d.id===state.selectedBlueprint?'aria-current="true"':''}>${escape(d.title)}</button>`).join('')}</div></div><div class="actions"><div class="view-switch" aria-label="蓝图布局">${iconControl('详情模式','detail',`data-bp-mode="detail" aria-pressed="${state.blueprintMode==='detail'}"`,state.blueprintMode==='detail')}${iconControl('抽屉模式','drawer',`data-bp-mode="drawer" aria-pressed="${state.blueprintMode==='drawer'}"`,state.blueprintMode==='drawer')}</div>${act('新建','新建蓝图','primary')}<details class="popover history-pop"><summary id="bp-history-toggle" aria-label="历史" title="历史">${glyph('history')}</summary><div class="pop-menu history-menu">${doc.history.length?doc.history.map(h=>`<button data-bp-history="${h.version}"><strong>${h.version}</strong><small>${h.time}</small></button>`).join(''):'<p class="muted">暂无历史版本</p>'}</div></details></div></div>${state.blueprintMode==='drawer'?`<div class="blueprint-drawers">${bpDocuments.map(d=>blueprintArticle(d,true)).join('')}</div>`:blueprintArticle(doc)}</div>`;}
function topics(){return `<div class="page-tools collection-tools"><div class="toolbar toolbar-left"><input id="topicSearch" aria-label="搜索议题" placeholder="搜索标题或关键词"><select aria-label="筛选议题"><option>全部进展</option><option>研讨中</option><option>已形成决定</option><option>目标已达成</option></select></div><div class="toolbar-right">${act('新建','新建议题','primary')}</div></div><section class="panel" data-area="M3 议题定位"><div id="topicRows">${row(state.title,'12 条讨论 · 2 个决定 · 3 项正式工作','研讨中')}${row('默认主题如何控制注意力与信息密度？','正文、讨论和判断分层展开','已形成决定')}${row('项目报告需要包含哪些验证依据？','资料及成果需要绑定准确执行实例','研讨中')}${row('完成首轮项目导航验证','达成说明已保存，保留过程记录','目标已达成')}</div></section>`;}
function topic(){return `<div class="topic-layout"><div class="object-toolbar"><button class="quiet" data-nav="topics">← 返回目录</button><div class="actions">${iconControl('编辑正文','edit','data-action="编辑议题"')}${iconControl('生命周期与更多','more','data-action="议题生命周期"')}</div></div><article class="topic-document" data-area="M3 正文与折叠决策"><h1>${escape(state.title)}</h1><div class="object-meta">${status('研讨中')}<span>正文 v3</span><span>更新于 10:31</span></div><div class="doc"><p>项目级主题应组织全部项目页面，包括蓝图、行动计划、督查与准确对象办理。旧页面只用于跑通业务，不继续限制信息组织。</p><h2>当前方案</h2><p>采用可信业务能力组件和受控主题定义。让阅读与操作留在主题空间，权限、状态及审计由原业务Owner执行。</p><h2>验证条件</h2><p>从项目列表进入，读改蓝图、新建议题、研讨、形成决定、落实工作、验收交付和回顾历史，全程无需返回旧聚合管理页。</p></div><details class="decision-group" id="topic-decisions" ${state.decisionExpanded.size?'open':''}><summary>决策 <span class="badge">2</span></summary><div class="decision-rows"><details class="decision-row" id="decision-1" ${state.decisionExpanded.has('decision-1')?'open':''}><summary><span>项目全部界面纳入主题体系</span>${status('已批准')}</summary><div class="decision-content"><p>方向已明确，具体设计与契约按真实模块验证后细化。</p><small>决定版本 v1 · 来源为当前议题</small><div class="actions">${act('勘误','决定勘误')}${act('补充','补充决定')}${act('替代','替代决定')}${act('撤销','撤销决定')}</div></div></details><details class="decision-row"><summary><span>先验证蓝图编辑与议题研讨</span>${status('草案')}</summary><div class="decision-content"><p>验证完成后再确定能力契约，尚未获批准。</p><div class="actions">${act('编辑','编辑决定草案')}${act('批准','批准决定草案')}${act('删除','删除决定草案','danger')}</div></div></details>${act('新建决策','新建决定草案','quiet')}</div></details></article><section class="activity-space" data-area="M4 讨论执行历史混合动态"><div class="activity-heading"><h2>动态</h2><div class="activity-filters">${[['all','全部'],['discussion','讨论'],['execution','执行'],['history','历史']].map(([key,label])=>`<button data-activity-filter="${key}" aria-pressed="${state.activityFilter===key}" class="${state.activityFilter===key?'active':''}">${label}</button>`).join('')}<select id="activityOrder" aria-label="动态时间顺序"><option value="asc" ${state.activityOrder==='asc'?'selected':''}>由早到晚</option><option value="desc" ${state.activityOrder==='desc'?'selected':''}>最新在前</option></select></div></div><div class="activity-feed">${activityRows()}</div><div class="reply-composer"><label for="reply" class="sr-only">发表讨论</label><textarea id="reply" placeholder="留下讨论、证据或反馈…">${escape(state.draft)}</textarea><div class="actions"><select aria-label="讨论类型"><option>研讨</option><option>重议</option><option>纠偏</option></select>${act('发表','发表讨论','primary')}</div></div></section></div>`;}

href="#topic" data-nav="topic">主题资源协议</a></div><footer>${act('完善内容','编辑行动计划')}${act('关联已有工作','关联已有工作','quiet')}</footer></article></div>`;}
function work(){return `<div class="page-tools collection-tools"><div class="toolbar toolbar-left"><input aria-label="搜索工作" placeholder="搜索工作标题"><select aria-label="工作视图"><option>列表</option><option>看板</option><option>时间计划</option></select></div><div class="toolbar-right">${act('新建','新建正式工作','primary')}</div></div>`+panel('当前工作',`<div class="tablewrap"><table class="table"><thead><tr><th>工作</th><th>进展</th><th>当前动作</th><th></th></tr></thead><tbody><tr><td><strong>实现全项目主题工作区</strong><p class="muted">项目主题议题 · 当前验收条件 v3</p></td><td>${status('待验收')}</td><td>核对最新交付</td><td>${btn('打开','task')}</td></tr><tr><td>补充资料与资源呈现</td><td>${status('进行中')}</td><td>等待执行者提交</td><td>${btn('打开','task')}</td></tr><tr><td>验证权限与旧链接迁移</td><td>${status('待开展')}</td><td>明确验收条件</td><td>${btn('打开','task')}</td></tr></tbody></table></div>`);}

function reports(){return head(names().reports,'先识别需要介入的异常，再按需读取汇报。',act('查看历史汇报','读取督查历史'))+`<div class="split"><section class="panel"><div class="panelhead"><h2>需要介入</h2>${status('1 项阻塞',true)}</div><article class="row"><div class="body"><h3>执行者无法读取指定资料</h3><p>当前授权未包含资料文件；不会自动扩大访问范围。</p></div>${status('阻塞',true)}</article><p class="muted">判断范围 → 补充说明 → 原工作恢复。当前能力按已有业务Owner确定，不在主题中发明权限批准。</p><div class="actions" style="margin-top:18px">${act('查看问题与处置','督查问题处置','primary')}${btn('进入相关工作','task')}</div></section>${panel('近期汇报',`<div class="row"><div class="body"><h3>本周建设回顾</h3><p>结论、成果与遗留问题分层阅读。</p></div>${act('阅读','读取周报')}</div><details><summary>全部汇报与复盘</summary><p>按周期和来源查阅，报告文字不代替业务完成。</p></details>`)}</div>`;}

function settings(){return head('项目设置','当前项目属性、主题与资源分别维护。',act('保存项目设置','保存项目设置','primary'))+`<div class="split"><section class="panel settings"><h2 style="margin-bottom:22px">基本信息</h2><div class="field"><label for="name">项目名称</label><input id="name" value="元垒 · 平台建设"></div><div class="field"><label for="slug">Slug · 首次设置后不可修改</label><input id="slug" value="yuanlei" readonly></div><div class="field"><label for="description">描述</label><textarea id="description">个人与小团队的 AI 工作平台</textarea></div><details><summary>分类、标签与弱负责人</summary><p>这些属性用于归类和标明，不提前建设组织权限。</p></details></section><aside class="stack">${panel('当前项目主题',`<p>${state.theme==='research'?'调研 · 课题研究':'默认 · 日常经营'}</p><p class="muted" style="margin:12px 0">候选、发布版本与项目选择不同。平台公共库维护属于平台职责，项目选择仍在主题空间。</p>${act('选择与预览主题','项目主题选择')}${act('维护项目候选','维护项目主题候选')}`)}${panel('文件目录与代码资源',`<details><summary>Workdir 与资源连接</summary><p>当前项目目录只读显示。Git资源的连接、审阅、提交、丢弃与发布分别授权。</p>${act('维护资源连接','项目Git资源设置')}${act('查看占用与审批','资源占用与审批')}</details><details style="margin-top:16px"><summary>危险操作</summary>${act('删除项目','删除项目','danger')}</details>`)}</aside></div>`;}
function projects(){return head('项目列表','这是平台页面；进入后采用项目自己的完整主题。')+`<div class="project-grid">${panel('元垒 · 平台建设',`<p class="muted">默认或调研主题由上方审阅控件切换。</p><div style="margin-top:20px">${btn('进入项目','overview','primary')}</div>`)}${panel('课题研究',`<p class="muted">不同项目可采用不同的主题组织方案。</p><div style="margin-top:20px">${btn('进入项目','overview')}</div>`)}</div>`;}
function render(){document.body.classList.toggle('research',state.theme==='research');document.querySelector('#sidebar').innerHTML=`<div class="projecthead"><div class="kicker">项目空间</div><h2>元垒 · 平台建设</h2><p>${state.theme==='research'?'调研主题':'默认主题'}</p></div>`+groups.map(([group,keys])=>`<div class="navgroup">${group}</div>`+keys.map(k=>`<button data-nav="${k}" class="${state.page===k||(state.page==='topic'&&k==='topics')||(state.page==='task'&&k==='work')||(state.page==='agent'&&k==='agents')?'active':''}" ${state.page===k?'aria-current="page"':''}>${icon(k)}${titleFor(k)}</button>`).join('')).join('')+'';document.querySelector('#crumb').textContent=state.page==='projects'?'元垒 / 项目列表':`项目空间 / ${titleFor(state.page)}`;let content='';if(state.scenario!=='ready'){let error=state.scenario!=='empty';content=head(titleFor(state.page),'当前状态仍由同一主题空间呈现。')+`<section class="panel empty"><h2>${state.scenario==='revoked'?'当前主题版本已撤回':error?'当前内容读取失败':'这里还没有内容'}</h2><p>${state.scenario==='revoked'?'保留原绑定事实，可显式选择其他版本。紧急办理由内置完整主题承载，不能绕过权限。':error?'错误不伪装为空数据；重试后保持当前页面。':'先创建一个对象，其他字段和统计不会提前占满页面。'}</p>${act(error?'重试':'创建','恢复场景','primary')}${state.scenario==='revoked'?act('预览内置完整主题','完整内置回退'):''}</section>`;}else content=({overview,blueprint,topics,topic,suggestions,work,task,reports,resources,agents,agent,settings,projects}[state.page]||overview)();document.querySelector('#screen').innerHTML=`<div class="designnote"><strong>设计逻辑 · ${titleFor(state.page)}</strong><p>${explanation[state.page]||''}</p><p>本稿展示组织、信息密度及交互路径。样例动作不证明服务已接通或历史语义已验证。</p></div>`+content;}
function closeModal(){const p=document.querySelector('#portal');if(!p||!p.innerHTML.trim())return;if(p.querySelector('textarea')&&state.dirty&&!confirm('演示草稿尚未保存，确定关闭？'))return;state.dirty=Boolean(state.bpEditing&&Object.hasOwn(state.bpDrafts,state.bpEditing))||Boolean(state.draft);p.innerHTML='';window.lastFocus?.focus();}
function modal(action){if(action==='新建蓝图'){window.lastFocus=document.activeElement;document.querySelector('#portal').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">新建</h2><form id="blueprintCreateForm"><label for="blueprintTitle">标题</label><input id="blueprintTitle" required placeholder="蓝图标题"><label for="blueprintFilename">文件名</label><input id="blueprintFilename" placeholder="不填写时由标题生成"><footer><button type="button" data-close>取消</button><button class="primary" type="submit">新建</button></footer></form><p class="muted">只创建本页演示文档，随后在主体编辑。</p></section></div>`;document.querySelector('#blueprintTitle')?.focus();return;}window.lastFocus=document.activeElement;let lifecycle=action==='议题生命周期';let detail=action==='查看决定'||action.includes('历史')||action.includes('证据');let text=lifecycle?'正式重开与继续发言不同；暂停建议只记录议题要求，不自动暂停任务或撤销决定。':action==='纳入正式工作'?'行动计划可以转为工作；关联已有工作是另一项操作。同一计划不能重复纳入不同工作。':action==='接受并完成'?'接受准确结果并完成任务需分别满足原业务条件；这里仅演示确认，不改变真实数据。':action.includes('撤销')?'撤销需要原因，已批准决定不能当草案删除。':action==='不采用行动计划'?'沿现有拒绝用例记录原因，不取消已关联的正式工作。此处仅为演示。':action==='删除项目'?'删除需要确认，作用范围和恢复规则按原项目Owner。此处不删除任何真实项目。':action==='编辑蓝图'?state.blueprint:action==='编辑议题'?state.title:'请说明本次操作的目的与依据。';document.querySelector('#portal').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle" data-action-name="${escape(action)}">${escape(action==='新建蓝图'?'新建':action)}</h2><p class="muted">可信能力在当前主题中呈现。原状态、权限和审计继续由业务Owner执行。</p>${lifecycle?'<label>操作及准入条件</label><select><option>归档（当前未归档）</option><option>关闭（按原进展准入）</option><option disabled>重新发起（拒绝后可用）</option><option disabled>正式重开（形成结论后可用）</option><option disabled>恢复（仅归档后可用）</option><option disabled>形成决定（须选择已批准的关联决定）</option></select><p class="muted">实际目标达成记录与正式生命周期操作区分。这里只展示准入说明，生产由原Owner校验。</p><label>正式重开时的执行要求</label><select><option>原方案继续执行</option><option>建议暂停执行（不联动任务）</option></select>':''}${detail?`<div class="notice" style="margin-top:20px">${escape(text)}</div><p>版本、来源与准确对象在这里阅读；不是跳到原长页面。</p>`:`<form id="actionForm"><label for="editText">${action==='新建议题'?'议题标题':'内容或原因'}</label><textarea id="editText">${escape(text)}</textarea>${action==='新建议题'?'<label>预期结果与验证条件</label><input value="说明希望改变的状态与判断依据">':''}<footer><button type="button" data-close>取消</button><button type="submit" class="primary">保存到演示稿</button></footer></form>`}${detail?'<footer><button data-close>关闭</button></footer>':''}<p class="muted" style="font-size:12px;margin-top:15px">合成示例 · 不保存到后端 · 不批准真实业务</p></section></div>`;document.querySelector('#portal textarea')?.focus();if(detail)document.querySelector('#portal button')?.focus();}
const explanation={overview:'先识别需要你判断的事，再阅读项目方向。不给所有业务对象各铺一张统计卡；待处理事项直接通往同主题详情。',blueprint:'详情模式聚焦单篇，抽屉模式同时阅读多篇。选择与历史浮层不占常驻空间，阅览和编辑直接在主体切换。',topics:'目录只提供定位线索，不把讨论和所有决策塞进列表。选择后进入完整议题详情。',topic:'正文持续可见，下方折叠决策。动态混合呈现可折叠讨论、一行历史和工作块，筛选只影响动态。',suggestions:'行动计划表达做什么、预期结果、依据与落实方式，转为或关联工作。现有建议接口只是暂时承载，计划不是已开始的任务。',work:'正式工作列表聚焦下一动作；详情将当前交付置于执行日志之前。',task:'当前依据、当前交付、审核意见与执行历史分层。接受交付和完成任务是不同操作，不按文案推断成功。',reports:'先处理异常。历史汇报按需进入，避免日报全文淹没需要介入的阻塞。',resources:'项目资料与平台文件浏览器明确区分。预览留在当前项目主题内，路径授权仍归文件Owner。',agents:'仅呈现当前项目的执行责任和待处理工作；模型、自动接受及配置在工作台中按需维护。',agent:'项目智能体的队列、待确认与配置在同主题页面呈现；平台会话属于明确跨界入口。',settings:'将基本信息、资源连接和主题选择分组，保留高风险操作的确认与说明。',projects:'平台项目列表是全局页面；进入某项目后，全部项目页面按该项目有效主题组织。'};

document.addEventListener('click',e=>{if(handleR3Click(e))return;const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault?.();navigate(nav.dataset.nav);return;}const tab=e.target.closest('[data-tab]');if(tab){state.topicTab=tab.dataset.tab;render();return;}if(e.target.closest('[data-close]')){closeModal();return;}const action=e.target.closest('[data-action]');if(action){let a=action.dataset.action;if(a==='恢复场景'||a==='完整内置回退'){state.scenario='ready';document.querySelector('#scenario').value='ready';render();toast('演示恢复：仍在当前项目主题中');}else if(a==='发表讨论'){state.draft=document.querySelector('#reply')?.value||'';if(!state.draft.trim())toast('先填写讨论内容');else{const id='discussion-new-'+(state.postedReplies.length+1);state.postedReplies.push({id,type:'discussion',time:'刚刚',body:state.draft});state.threadExpanded.add(id);state.draft='';state.dirty=false;render();toast('讨论已保存到演示稿；不会自动重开议题');}}else modal(a);}});
document.addEventListener('input',e=>{if(e.target.dataset?.bpDraft){state.bpDrafts[e.target.dataset.bpDraft]=e.target.value;state.dirty=true;}if(['editText','reply'].includes(e.target.id)){state.dirty=true;if(e.target.id==='reply')state.draft=e.target.value;}if(e.target.id==='topicSearch'){for(const row of document.querySelectorAll('#topicRows .row'))row.classList.toggle('hide',!row.textContent.includes(e.target.value));}});
document.addEventListener('submit',e=>{if(e.target.id==='blueprintCreateForm'){e.preventDefault();const title=document.querySelector('#blueprintTitle').value.trim();if(!title){toast('请填写标题');return;}const file=document.querySelector('#blueprintFilename').value.trim()||title+'.md';const id='blueprint-'+(bpDocuments.length+1);bpDocuments.push({id,file,title,content:'',history:[]});state.selectedBlueprint=id;state.historyVersion=null;state.blueprintMode='detail';state.bpEditing=id;state.bpDrafts[id]='';state.page='blueprint';document.querySelector('#portal').innerHTML='';render();return;}if(e.target.id!=='actionForm')return;e.preventDefault();let action=document.querySelector('#modalTitle').dataset.actionName||document.querySelector('#modalTitle').textContent,v=document.querySelector('#editText').value;if(!v.trim()){toast('内容或原因不能为空');return;}if(action==='新建蓝图'){const doc={id:'blueprint-'+(bpDocuments.length+1),file:v.slice(0,24)+'.md',title:v.slice(0,64),content:'新建蓝图的演示正文。请切换编辑继续维护。',history:[]};bpDocuments.push(doc);state.selectedBlueprint=doc.id;state.page='blueprint';state.historyVersion=null;}if(action==='编辑蓝图')state.blueprint=v;if(action==='编辑议题'||action==='新建议题'){state.title=v;state.page='topic';state.topicTab='body';}state.dirty=false;document.querySelector('#portal').innerHTML='';render();toast('已保存到本页演示内存；没有业务请求');});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelectorAll('.bp-select').forEach(x=>{x.classList.remove('open');x.dataset.dismissed='true';x.querySelector('.bp-switch')?.setAttribute('aria-expanded','false');});}});document.addEventListener('pointerout',e=>{const box=e.target.closest?.('.bp-select');if(box&&!box.contains(e.relatedTarget))box.dataset.dismissed='false';});document.addEventListener('change',e=>{if(e.target.id==='activityOrder'){state.activityOrder=e.target.value;render();}});document.addEventListener('toggle',e=>{const id=e.target.dataset?.threadId;if(id){if(e.target.open)state.threadExpanded.add(id);else state.threadExpanded.delete(id);}},true);document.querySelector('#theme').onchange=e=>{if(state.dirty&&!confirm('切换主题前确定离开未保存演示稿？')){e.target.value=state.theme;return;}state.dirty=false;state.theme=e.target.value;render();};document.querySelector('#density').onchange=e=>document.body.classList.toggle('density-compact',e.target.value==='compact');document.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;render();};document.querySelector('#mode').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#annotations').onclick=e=>{let a=document.body.classList.toggle('annotated');e.target.setAttribute('aria-pressed',String(a));};document.querySelector('#mobilemenu').onclick=e=>{let a=document.querySelector('#shell').classList.toggle('navopen');e.target.setAttribute('aria-expanded',String(a));};render();
</script></body></html>
